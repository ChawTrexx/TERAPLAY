    /* Container jo background aur image dono ko hold karega */
.thumb-container {
  width: 100%;
  height: 260px; /* Aapki pasand ki height */
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Background wali blurred image */
.thumb-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover; /* Puri jagah fill karega */
  filter: blur(15px) brightness(0.6); /* Blur effect aur thoda dark */
  transform: scale(1.1); /* Taki edges pe white line na dikhe */
  z-index: 1;
}

/* Samne wali main image */
.thumb-main {
  position: relative;
  z-index: 2;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain; /* Image kategi nahi, puri dikhegi */
}

@media(max-width:700px){
  .thumb-container { height: 200px; }
}

<script type="module">
const SUPABASE_URL = "https://emhnjxzenbxsaxdpzltf.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtaG5qeHplbmJ4c2F4ZHB6bHRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0Nzk2MzcsImV4cCI6MjA5MTA1NTYzN30.7f0MSHe_UABXWnLhZh0oPYrGzMiiggiBpALuhLnDL1U";

let VIDEOS = [];
let currentPage = 1;
const ITEMS_PER_PAGE = 30;

const list = document.getElementById('list');
const pagination = document.getElementById('pagination');

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;')
                .replace(/</g,'&lt;')
                .replace(/>/g,'&gt;');
}

// 🔥 SHARE VIDEO
async function shareVideo(id){
  const video = VIDEOS.find(v => v.id == id);
  if (!video) return alert("Video not found!");

  const url = `${window.location.origin}/Watch.html?id=${id}`;
  const title = video.title || "Watch this video";

  if (navigator.share){
    navigator.share({ title, url }).catch(()=>{});
  } else {
    prompt("Copy video link:", url);
  }
}

window.shareVideo = shareVideo;

// 🔥 FETCH FROM SUPABASE
async function fetchVideos(){
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/videos?select=*`,
    {
      headers: {
        "apikey": API_KEY,
        "Authorization": `Bearer ${API_KEY}`
      }
    }
  );

  const data = await res.json();

  VIDEOS = data.map(v => ({
    ...v,
    timestamp: new Date(v.created_at).getTime()
  }));

  render('trending');
}

// 🔥 RENDER
function render(filter='trending'){
  let items=[...VIDEOS];

  if(filter==='recent') items.sort((a,b)=>b.timestamp-a.timestamp);
  else if(filter==='oldest') items.sort((a,b)=>a.timestamp-b.timestamp);
  else items.sort((a,b)=>b.views-a.views);

  const totalPages=Math.ceil(items.length/ITEMS_PER_PAGE);
  const start=(currentPage-1)*ITEMS_PER_PAGE;
  const paginated=items.slice(start,start+ITEMS_PER_PAGE);

  list.innerHTML='';
  for(const v of paginated){
    list.innerHTML +=`
      <div class="card">
        <a href="Watch.html?id=${v.id}">
           <div class="thumb-container">
        <img class="thumb-bg" src="${v.thumbnail}" />
        <img class="thumb-main" src="${v.thumbnail}" />
      </div>
        </a>
        <div class="meta">
          <div class="title">${escapeHtml(v.title)}</div>
          <div class="views">${Number(v.views).toLocaleString()} views</div>
        </div>
        <div class="actions">
          <a href="Watch.html?id=${v.id}"><button class="primary">Play</button></a>
          <button onclick="shareVideo('${v.id}')">Share</button>
        </div>
      </div>`;
  }

  pagination.innerHTML = `
    <div class="pagination">
      <button onclick="goPage(${Math.max(1,currentPage-1)})" ${currentPage===1?'disabled':''}>◀ Prev</button>
      <div class="page-info">Page ${currentPage} / ${totalPages}</div>
      <button onclick="goPage(${Math.min(totalPages,currentPage+1)})" ${currentPage===totalPages?'disabled':''}>Next ▶</button>
    </div>`;
}

window.goPage=function(p){
  currentPage=p;
  const active=document.querySelector('.chip.active')?.dataset.filter||'trending';
  render(active);
}

document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    currentPage=1;
    render(c.dataset.filter);
  });
});

// 🚀 LOAD
fetchVideos();
</script>
