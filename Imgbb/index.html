<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temporary Image Host</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f3f4f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
.card { background: #111827; border: 1px solid #1f2937; padding: 24px; border-radius: 16px; width: 100%; max-width: 460px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 30px; }
h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
.group { margin-bottom: 14px; }
label { display: block; font-size: 0.85rem; color: #9ca3af; margin-bottom: 6px; }
input, select { width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 8px; outline: none; }
button { width: 100%; padding: 12px; background: #22c55e; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 8px; margin-top: 10px; transition: 0.2s; }
button:hover { background: #16a34a; }
#result { margin-top: 20px; padding-top: 16px; border-top: 1px solid #374151; display: none; }
.preview-container { width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; text-align: center; }
.img-preview { max-width: 100%; max-height: 200px; object-fit: contain; }
pre { background: #030712; padding: 10px; border-radius: 8px; font-size: 0.75rem; color: #a7f3d0; max-height: 140px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }

/* GALLERY SECTION STYLES */
.gallery-card { background: #111827; border: 1px solid #1f2937; padding: 20px; border-radius: 16px; width: 100%; max-width: 800px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #1f2937; padding-bottom: 8px; }
.gallery-title { color: #38bdf8; font-size: 1.2rem; font-weight: bold; }
.image-count { font-size: 0.85rem; color: #34d399; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.grid-item { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; }
.grid-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #000; }
.copy-btn { width: 100%; padding: 6px; background: #0284c7; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; margin-top: auto; transition: 0.2s; }
.copy-btn:hover { background: #0369a1; }
</style>
</head>
<body>

<div class="card">
  <h2>🖼️ Image Host</h2>

  <div class="group">
    <label>API Key (Optional)</label>
    <input type="text" id="apiKey" value="a6a11d5e51efceba81e080a069ed9556">
  </div>

  <div class="group">
    <label>Auto Delete Expiration</label>
    <select id="expiration">
      <option value="60" selected>1 Minute (60 Sec)</option>
      <option value="300">5 Minutes</option>
      <option value="3600">1 Hour</option>
    </select>
  </div>

  <div class="group">
    <label>Select Image File</label>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <button onclick="uploadImage()" id="uploadBtn">Upload Image</button>

  <div id="result">
    <span style="color:#4ade80;">✅ Upload Successful</span>
    <div class="preview-container" style="margin-top:10px;">
      <img id="preview" class="img-preview" src="">
    </div>

    <div class="group">
      <label>Public URL</label>
      <input type="text" id="publicUrlInput" readonly>
    </div>

    <div class="group">
      <label>ImgBB-Style Response</label>
      <pre id="jsonOutput"></pre>
    </div>
  </div>
</div>

<!-- GALLERY CONTAINER FOR ALL SAVED IMAGES -->
<div class="gallery-card">
  <div class="gallery-header">
    <div class="gallery-title">📁 All Database Images</div>
    <div class="image-count" id="imageCount">Total: 0</div>
  </div>
  <div class="grid" id="imageGrid">
    <p style="color:#9ca3af; font-size:0.85rem;" id="loadingText">Loading all images from database...</p>
  </div>
</div>

<script>
  const supabaseUrl = "https://askvmuxefttgqvnnalod.supabase.co";
  const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFza3ZtdXhlZnR0Z3F2bm5hbG9kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTMyNzEsImV4cCI6MjEwMTMyOTI3MX0.ImEDrU-D_M7A-wgZSAvLK8lSAj76YUza-WPdFkRaGQk";
  
  const client = supabase.createClient(supabaseUrl, supabaseAnonKey);

  // Page load hone par database se saari images fetch hongi
  window.onload = loadUploadedImages;

  async function loadUploadedImages() {
    const grid = document.getElementById("imageGrid");
    const countEl = document.getElementById("imageCount");

    try {
      // Database se SABA'I records fetch karein (newest first)
      const { data, error } = await client
        .from('uploads')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;

      if (!data || data.length === 0) {
        grid.innerHTML = '<p style="color:#9ca3af; font-size:0.85rem;">Database me koi image nahi mila.</p>';
        countEl.innerText = "Total: 0";
        return;
      }

      grid.innerHTML = "";
      countEl.innerText = `Total: ${data.length}`;

      // Sabhi images ko render karein
      data.forEach(item => {
        const { data: publicData } = client.storage.from('images').getPublicUrl(item.file_path);
        const card = createGridCard(publicData.publicUrl);
        grid.appendChild(card); // Newest list element comes first
      });

    } catch (err) {
      console.error(err);
      grid.innerHTML = '<p style="color:#ef4444; font-size:0.85rem;">Images load karne me error aaya.</p>';
    }
  }

  // HTML Element Element Generator for Grid
  function createGridCard(url) {
    const item = document.createElement("div");
    item.className = "grid-item";
    item.innerHTML = `
      <img src="${url}" alt="Database Image" loading="lazy">
      <button class="copy-btn" onclick="copyToClipboard('${url}', this)">Copy Link</button>
    `;
    return item;
  }

  function copyToClipboard(text, btnElement) {
    navigator.clipboard.writeText(text);
    const originalText = btnElement.innerText;
    btnElement.innerText = "Copied! ✅";
    btnElement.style.background = "#22c55e";
    setTimeout(() => {
      btnElement.innerText = originalText;
      btnElement.style.background = "#0284c7";
    }, 1500);
  }

  async function uploadImage() {
    const expiration = parseInt(document.getElementById("expiration").value);
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");

    if (!fileInput.files[0]) {
      alert("Please select an image file!");
      return;
    }

    uploadBtn.innerText = "Uploading...";
    uploadBtn.disabled = true;

    try {
      // 1. Upload file to Storage Bucket 'images'
      const file = fileInput.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `${Math.random().toString(36).substring(2, 10)}_${Date.now()}.${fileExt}`;

      const { data: storageData, error: storageError } = await client
        .storage
        .from('images')
        .upload(fileName, file);

      if (storageError) throw storageError;

      // 2. Get Public URL
      const { data: publicUrlData } = client
        .storage
        .from('images')
        .getPublicUrl(fileName);

      const publicUrl = publicUrlData.publicUrl;
      const expiresAt = new Date(Date.now() + expiration * 1000).toISOString();

      // 3. Save entry in database for auto-delete track
      await client.from('uploads').insert([{
        file_path: fileName,
        delete_token: Math.random().toString(36).substring(2, 12),
        expires_at: expiresAt
      }]);

      // 4. Response Payload
      const responsePayload = {
        data: {
          id: fileName.split('.')[0],
          title: file.name,
          url: publicUrl,
          display_url: publicUrl,
          size: file.size,
          expiration: expiration,
          image: { filename: file.name, url: publicUrl }
        },
        success: true,
        status: 200
      };

      document.getElementById("result").style.display = "block";
      document.getElementById("preview").src = publicUrl;
      document.getElementById("publicUrlInput").value = publicUrl;
      document.getElementById("jsonOutput").innerText = JSON.stringify(responsePayload, null, 2);

      // 5. Instantly top par add karein new image ko
      const grid = document.getElementById("imageGrid");
      const loadingText = document.getElementById("loadingText");
      if (loadingText) loadingText.remove();

      const newCard = createGridCard(publicUrl);
      grid.prepend(newCard);

      // Update Total Counter
      const countEl = document.getElementById("imageCount");
      const currentCount = parseInt(countEl.innerText.replace(/\D/g, '') || 0);
      countEl.innerText = `Total: ${currentCount + 1}`;

    } catch (err) {
      console.error(err);
      alert("Upload Failed: " + err.message);
    } finally {
      uploadBtn.innerText = "Upload Image";
      uploadBtn.disabled = false;
    }
  }
</script>
</body>
</html>
