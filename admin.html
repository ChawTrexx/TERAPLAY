// ===== ImgBB Upload (UNCHANGED) =====
async function uploadThumbnail() {
    const fileInput = document.getElementById("imageUpload");
    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    const apiKey = "28303bb2f8b9d2907349e5567b265f2d";

    const reader = new FileReader();
    reader.readAsDataURL(file);

    reader.onload = async () => {
        const base64Data = reader.result.split(",")[1];

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
            method: "POST",
            body: new URLSearchParams({ image: base64Data }),
        });

        const result = await response.json();

        if (result.status === 200) {
            document.getElementById("thumb").value = result.data.url;
            document.getElementById("result").innerText = "✔ Thumbnail uploaded!";
        }
    };
}

// ===== LINK HELPERS =====


function convertDropboxURL(url){
    try {
        if(url.includes("dropbox.com")) {
            let u = new URL(url);
            u.searchParams.set("raw", "1");
            u.searchParams.delete("dl");
            return u.toString();
        }
    } catch(e){}
    return url;
}

function convertTeraBoxURL(url){
    try {
        // clean URL (remove params)
        url = url.split("?")[0];

        const match = url.match(/\/s\/([a-zA-Z0-9_-]+)/);
        if(match){
            let id = match[1];

            // remove starting "1" only if present
            if(id.charAt(0) === "1"){
                id = id.slice(1);
            }

            return `https://s1.mdiskplay.com/videos/${id}/source.m3u8`;
        }
    } catch(e){}

    return null;
}

function extractIframeSrc(iframe){
    const match = iframe.match(/src\s*=\s*["']([^"']+)["']/i);
    return match ? match[1] : null;
}

function makeSafeIframe(url){
    return `<iframe src="${url}" width="510" height="400" frameborder="0" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>`;
}

function detectType(input){
    input = input.trim();

    if(input.startsWith("<iframe")){
        const src = extractIframeSrc(input);
        if(src){
            return { type:"iframe", url: makeSafeIframe(src) };
        }
    }

    if(input.includes("terabox")){
    return { type:"video", url: convertTeraBoxURL(input) };
    }

    if(input.includes("dropbox")){
        return { type:"video", url: convertDropboxURL(input) };
    }

    return { type:"video", url: input };
}







  

// ===== TELEGRAM SEND =====
async function sendTelegram(title, thumb, link){
    try{
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                chat_id: CHAT_ID,
                photo: thumb,
                caption: `${title}\n${link}`
            })
        });
    }catch(e){
        console.log("Telegram error");
    }
}

// ===== MAIN UPLOAD =====
document.getElementById("upload").onclick = async () => {

    const title = document.getElementById("title").value.trim();
    const thumb = document.getElementById("thumb").value.trim();

    const inputs = document.querySelectorAll(".videoInput");
    const links = [];

    inputs.forEach(i=>{
        if(i.value.trim()){
            links.push(i.value.trim());
        }
    });

    if(!title || !thumb || links.length===0){
        alert("Fill all fields");
        return;
    }

    let part = 1;

    for(const link of links){

        const {url, type} = detectType(link);

        const finalTitle = links.length > 1 
            ? `${title} Part ${part}` 
            : title;

        try{
            await fetch(`${SUPABASE_URL}/rest/v1/videos`, {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "apikey":API_KEY,
                    "Authorization":`Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    title: finalTitle,
                    thumbnail: thumb,
                    video_link: url,
                    type: type,
                    views: 0
                })
            });

            // Telegram send
            const pageUrl = `${location.origin}/Watch.html?id=latest`;
            await sendTelegram(finalTitle, thumb, pageUrl);

            part++;

        }catch(err){
            console.log("Upload error", err);
        }
    }

    alert("✅ All videos uploaded!");

    // clear
    document.getElementById("title").value="";
    document.getElementById("thumb").value="";
    document.getElementById("videoContainer").innerHTML =
      `<textarea class="videoInput" placeholder="Paste video link"></textarea>`;
}; 


  // ==== Load Data from Supabase ====
async function loadList(){
    const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`, {
        headers: {
            "apikey": API_KEY,
            "Authorization": `Bearer ${API_KEY}`
        }
    });

    const data = await res.json();

    document.getElementById("list").innerHTML = data.map(v=>`
        <div class="video-item">
            <img src="${v.thumbnail}">
            <b>${v.title}</b><br>
            <small>${v.views} views</small><br>
            <button class="delete-btn" onclick="del(${v.id})">DELETE</button>
        </div>
    `).join("");
}

// ==== Delete from Supabase ====
window.del = async id=>{
    if(confirm("Delete this video?")){
        await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${id}`, {
            method: "DELETE",
            headers: {
                "apikey": API_KEY,
                "Authorization": `Bearer ${API_KEY}`
            }
        });
        loadList();
    }
};

loadList();
