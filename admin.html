<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraBox Auto Player</title>

<!-- HLS Player -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    background: #000;
    color: #fff;
    text-align: center;
    font-family: Arial;
}

input {
    width: 80%;
    padding: 12px;
    margin: 15px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 12px 25px;
    background: hotpink;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

video {
    width: 100%;
    max-width: 900px;
    margin-top: 20px;
    border-radius: 12px;
}
</style>
</head>

<body>

<h2>🔥 TeraBox Video Player</h2>

<input type="text" id="link" placeholder="Paste TeraBox link here">
<br>
<button onclick="playVideo()">▶ Play Video</button>

<br>

<video id="player" controls autoplay></video>

<script>
async function playVideo() {

    let inputLink = document.getElementById("link").value;

    if (!inputLink) {
        alert("Paste link first!");
        return;
    }

    const apiUrl = "https://api.playterabox.com/api/proxy";
    const secret = "pk_g2wldd6dcjbmvbhj63o6c9";

    const fullUrl = `${apiUrl}?secret=${secret}&url=${encodeURIComponent(inputLink)}`;

    // CORS Proxy
    const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(fullUrl);

    try {
        const res = await fetch(proxy);
        const data = await res.json();

        console.log(data);

        if (data.status === "success") {

            const video = data.list[0];

            // Best quality auto select
            const videoUrl =
                video.fast_stream_url?.["1080p"] ||
                video.fast_stream_url?.["720p"] ||
                video.fast_stream_url?.["480p"] ||
                video.stream_url;

            const player = document.getElementById("player");

            // Thumbnail
            player.poster = video.thumbnail;

            // HLS Player Setup
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoUrl);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    player.play();
                });
            } 
            else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = videoUrl;
                player.play();
            }

        } else {
            alert("❌ API failed!");
        }

    } catch (err) {
        console.error(err);
        alert("❌ CORS / API Error");
    }
}
</script>

</body>
</html>
