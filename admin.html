<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Upload</title>

<style>
body{background:#0b0b0b;color:#fff;font-family:Arial;padding:20px;}
.box{max-width:600px;margin:auto;background:#111;padding:20px;border-radius:12px;}
input,textarea{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;}
button{padding:12px;border:0;background:#5b4dff;color:#fff;border-radius:8px;cursor:pointer;width:100%;}
#result{color:#72ff7e;font-size:13px;}
</style>
</head>
<body>

<div class="box">
<h2>🚀 Advanced Upload Panel</h2>

<input type="file" id="imageUpload">
<p id="result"></p>

<input id="thumb" placeholder="Thumbnail auto fill">

<input id="title" placeholder="Video title (Example: Rani Episode)">

<textarea id="video" placeholder="Paste multiple links (1 per line)"></textarea>

<button id="upload">UPLOAD ALL</button>
</div>

<script>
const SUPABASE_URL = "https://emhnjxzenbxsaxdpzltf.supabase.co";
const API_KEY = "YOUR_SUPABASE_KEY";

// 🔥 TELEGRAM CONFIG
const BOT_TOKEN = "YOUR_BOT_TOKEN";
const CHAT_ID = "YOUR_CHANNEL_ID";

// ===== ImgBB Upload (UNCHANGED) =====
async function uploadThumbnail() {
    const fileInput = document.getElementById("imageUpload");
    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    const apiKey = "28303bb2f8b9d2907349e5567b265f2d";

    const reader = new FileReader();
    reader.readAsDataURL(file);

    reader.onload = async () => {
        const base64Data = reader.result.split(",")[1];

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
            method: "POST",
            body: new URLSearchParams({ image: base64Data }),
        });

        const result = await response.json();

        if (result.status === 200) {
            document.getElementById("thumb").value = result.data.url;
            document.getElementById("result").innerText = "✔ Thumbnail uploaded!";
        }
    };
}
document.getElementById("imageUpload").addEventListener("change", uploadThumbnail);

// ===== LINK HELPERS =====
function convertDropboxURL(url){
    try {
        if(url.includes("dropbox.com")) {
            let u = new URL(url);
            u.searchParams.set("raw", "1");
            u.searchParams.delete("dl");
            return u.toString();
        }
    } catch(e){}
    return url;
}

function convertTeraBoxURL(url){
    try {
        const match = url.match(/\/s\/([a-zA-Z0-9_-]+)/);
        if(match){
            return `https://terabox.beer/watch/${match[1]}`;
        }
    } catch(e){}
    return url;
}

function extractIframeSrc(iframe){
    const match = iframe.match(/src\s*=\s*["']([^"']+)["']/i);
    return match ? match[1] : null;
}

function makeSafeIframe(url){
    return `<iframe src="${url}" width="510" height="400" frameborder="0" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>`;
}

function detectType(input){
    input = input.trim();

    if(input.startsWith("<iframe")){
        const src = extractIframeSrc(input);
        if(src){
            return { type:"iframe", url: makeSafeIframe(src) };
        }
    }

    if(input.includes("terabox")){
        return { type:"iframe", url: makeSafeIframe(convertTeraBoxURL(input)) };
    }

    if(input.includes("dropbox")){
        return { type:"video", url: convertDropboxURL(input) };
    }

    return { type:"video", url: input };
}

// ===== TELEGRAM SEND =====
async function sendTelegram(title, thumb, link){
    const text = `${title}\n${link}`;

    try{
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({
                chat_id: CHAT_ID,
                photo: thumb,
                caption: text
            })
        });
    }catch(e){
        console.log("Telegram error");
    }
}

// ===== MAIN UPLOAD =====
document.getElementById("upload").onclick = async () => {

    const title = document.getElementById("title").value.trim();
    const thumb = document.getElementById("thumb").value.trim();
    const videoInput = document.getElementById("video").value.trim();

    if(!title || !thumb || !videoInput){
        alert("Fill all fields");
        return;
    }

    const links = videoInput.split("\n").filter(x=>x.trim());

    let part = 1;

    for(const link of links){

        const {url, type} = detectType(link);

        const finalTitle = links.length > 1 
            ? `${title} Part ${part}` 
            : title;

        try{
            await fetch(`${SUPABASE_URL}/rest/v1/videos`, {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "apikey":API_KEY,
                    "Authorization":`Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    title: finalTitle,
                    thumbnail: thumb,
                    video_link: url,
                    type: type,
                    views: 0
                })
            });

            // 🔥 TELEGRAM SEND
            const pageUrl = `${location.origin}/Watch.html?id=latest`;
            sendTelegram(finalTitle, thumb, pageUrl);

            part++;

        }catch(err){
            console.log("Upload error", err);
        }
    }

    alert("✅ All videos uploaded!");

    document.getElementById("title").value="";
    document.getElementById("video").value="";
    document.getElementById("thumb").value="";
};
</script>

</body>
</html>
