<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,max-scale=1">
<title>Watch - Teen18</title> 
<meta name="referrer" content="no-referrer-when-downgrade" /> 

<style>
:root{--accent:#ff00ff;}

body{
  margin:0;background:#0b0b0b;color:#fff;
  font-family:Arial, sans-serif;
}

/* HEADER */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  background:#111;
}
.logo{
  font-weight:800;
  color:var(--accent);
  letter-spacing:2px;
  text-shadow:0 0 4px var(--accent);
}
.home-btn{
  color:white;
  text-decoration:none;
  font-weight:600;
  padding:4px 12px;
  border-radius:6px;
  border:1px solid var(--accent);
  transition:0.3s;
}
.home-btn:hover{
  background:var(--accent);
  color:#111;
}

/* LAYOUT */
.container{display:flex;gap:12px;padding:0px;}
@media(max-width:850px){.container{flex-direction:column;}}

.video-box{flex:2;}
.video-box iframe, .video-box video{
  width:100%;height:220px;border-radius:10px;background:#000;
}

.title{font-size:18px;margin:12px 0 6px;}
.meta{color:#aaa;font-size:13px;margin-bottom:16px;}



/* RECOMMEND SECTION */
.recommend-box{
  flex:1;overflow-y:auto;max-height:85vh;
  padding-right:6px;
}
.recommend-item{
  display:flex;gap:10px;margin-bottom:14px;cursor:pointer;
  transition:.2s;
}
.recommend-item:hover{opacity:.7;transform:scale(.97);}
.recommend-item img{
  width:140px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
}
.recommend-item b{
  font-size:14px;
  font-weight:600;
}
.recommend-item small{
  font-size:12px;
  color:#aaa;
}

@media(max-width:600px){
  .recommend-item img{width:120px;height:80px;}
  .recommend-item b{font-size:13px;}
}


/* COMMENT PREVIEW */
.comment-preview{
  background:#333;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  cursor:pointer;
}


/* COMMENT PANEL */
.comment-panel{
  position:fixed;
  left:0;
  bottom:-100%;
  width:100vw;
  height:70%;
  background:#222;
  border-radius:20px 20px 0 0;
  padding:15px;
  box-sizing:border-box;
  transition:.35s;
  z-index:9999;
  display:flex;
  flex-direction:column;
}
.comment-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #333;
  padding-bottom:10px;
}
.close-btn{
  font-size:20px;
  cursor:pointer;
}
.comments-list{
  overflow-y:auto;
  flex:1;
  margin-top:10px;
}
.comment-item{
  background:#111;
  padding:10px;
  border-radius:10px;
  margin:8px 0;
}
.comment-item .user{
  font-size:14px;
  color:var(--accent);
  margin-bottom:5px;
}
.comment-input-box{
  display:flex;
  gap:10px;
}
.comment-input-box input{
  flex:1;
  padding:10px;
  background:#000;
  border:1px solid #444;
  border-radius:8px;
  color:white;
}
.comment-input-box button{
  padding:10px 15px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:#555;border-radius:10px;} 
.no-select {user-select:none;}
</style>
</head>
<body class="no-select">

<header>
  <div class="logo">TEEN18 XXX</div>
  <a href="index.html" class="home-btn">Home</a>
</header>


<div class="container">

  <div class="video-box">
    <div id="player"></div>
    <div class="title" id="vtitle"></div>
    <div class="meta" id="vmeta"></div>

    <div class="comment-preview" onclick="openComments()">
      <b>Comments (<span id="commentCount">0</span>)</b>
      <p id="latestComment" style="color:#ccc;font-size:14px;margin-top:4px;">
        No comments yet...
      </p>
    </div>

  </div>

  <div class="recommend-box" id="recommended"></div>

</div>


<div id="commentPanel" class="comment-panel">

  <div class="comment-header">
      <b style="font-size:18px;">Comments</b>
      <span class="close-btn" onclick="closeComments()">✖</span>
  </div>

  <div id="commentsList" class="comments-list"></div>

  <div class="comment-input-box">
      <input id="commentText" placeholder="Add a comment..." maxlength="200">
      <button onclick="sendComment()">Post</button>
  </div>

</div> 


<script type="module">
const SUPABASE_URL = "https://emhnjxzenbxsaxdpzltf.supabase.co";
const API_KEY = "PASTE_YOUR_ANON_KEY_HERE";

// ===== GET VIDEO ID =====
const videoId = new URLSearchParams(location.search).get("id");

// ===== RENDER VIDEO =====
function renderVideo(v){
  return `<iframe src="${v.video_link}" allowfullscreen
  style="width:100%;height:250px;border:0;"></iframe>`;
}

// ===== LOAD VIDEO =====
async function loadVideo(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}&select=*`, {
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY
    }
  });

  const data = await res.json();
  if(!data.length) return;

  const v = data[0];

  document.getElementById("player").innerHTML = renderVideo(v);
  document.getElementById("vtitle").innerText = v.title;
  document.getElementById("vmeta").innerText = (v.views || 0) + " views";

  // 🔥 UPDATE VIEWS
  await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}`, {
    method:"PATCH",
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      views:(v.views||0)+1
    })
  });
}

// ===== LOAD RECOMMENDED =====
async function loadRecommended(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?select=*&order=created_at.desc`, {
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY
    }
  });

  const data = await res.json();
  const box = document.getElementById("recommended");
  box.innerHTML = "";

  data.forEach(v=>{
    if(v.id == videoId) return;

    box.innerHTML += `
      <div class="recommend-item" onclick="location='Watch.html?id=${v.id}'">
        <img src="${v.thumbnail}">
        <div>
          <b>${v.title}</b><br>
          <small>${v.views || 0} views</small>
        </div>
      </div>`;
  });
}

// ================= COMMENT SYSTEM =================

// 👉 TABLE CREATE KARNA HOGA (SQL RUN KARO)
async function loadComments(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?video_id=eq.${videoId}&select=*`, {
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY
    }
  });

  const data = await res.json();
  const list = document.getElementById("commentsList");

  list.innerHTML = "";

  document.getElementById("commentCount").innerText = data.length;
  document.getElementById("latestComment").innerText = data[0]?.text || "No comments yet...";

  data.reverse().forEach(c=>{
    list.innerHTML += `
      <div class="comment-item">
         <div class="user">⭐ ${c.user_name}</div>
         <div>${c.text}</div>
      </div>`;
  });
}

// USER NAME
if (!localStorage.getItem("userName")) {
  localStorage.setItem("userName", "User" + Math.floor(Math.random()*9999));
}
const username = localStorage.getItem("userName");

// SEND COMMENT
window.sendComment = async ()=>{
  const text = document.getElementById("commentText").value.trim();
  if(!text) return;

  await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
    method:"POST",
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      video_id: videoId,
      user_name: username,
      text: text
    })
  });

  document.getElementById("commentText").value="";
  loadComments();
};

// PANEL
window.openComments = ()=> document.getElementById("commentPanel").style.bottom="0";
window.closeComments = ()=> document.getElementById("commentPanel").style.bottom="-100%";

// INIT
loadVideo();
loadRecommended();
loadComments();
</script>
</body>
</html>
