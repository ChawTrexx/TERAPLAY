    <!-- 🔥 Video -->
    <video-player class="w-full h-full">

        <video-skin class="w-full h-full">

  id="player"
  autoplay
  muted
  playsinline
  loop>
            </video>
            
        </video-skin>

    </video-player>

</div>

<script>

// 🔥 URL Param
const param =
window.location.search
.replace("?=","")
.trim();

if(param){

    // 🔥 Decode URL
    const teraUrl =
    decodeURIComponent(param);

    // 🔥 Stream URL
    const streamUrl =
    "https://1024teradownloader.in/api/video-stream?url="
    + encodeURIComponent(teraUrl)
    + "&index=0&quality=360p";

    const video =
    document.getElementById("player");

    // 🔥 HLS Support
    if(Hls.isSupported()){

        const hls =
        new Hls();

        hls.loadSource(streamUrl);

        hls.attachMedia(video);

    }else{

        video.src =
        streamUrl;

    }

}else{

    alert("No Video URL Found");

}

</script>
