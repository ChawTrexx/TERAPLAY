<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport"
content="width=device-width, initial-scale=1.0"/>

<title>Teen18 Premium Player</title>

<!-- 🔥 Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- 🔥 VideoJS -->
<script type="module"
src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js">
</script>

<!-- 🔥 HLS -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
    font-family:'Segoe UI',sans-serif;
}

.bg-blur{

    background:
    url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1920&auto=format&fit=crop')
    center/cover no-repeat;
}

video{

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}

</style>
</head>

<body class="w-full h-screen overflow-hidden bg-black">

<!-- 🔥 Background -->
<div class="fixed inset-0
bg-blur
scale-110
blur-xl
brightness-50
-z-20">
</div>

<!-- 🔥 Overlay -->
<div class="fixed inset-0
bg-gradient-to-b
from-black/80
via-black/40
to-black/95
-z-10">
</div>

<!-- 🔥 Header -->
<div class="fixed
top-4
left-1/2
-translate-x-1/2

w-[94%]
h-[78px]

rounded-3xl

px-6

flex
items-center
justify-between

backdrop-blur-2xl

bg-white/5

border
border-white/10

shadow-[0_0_30px_rgba(255,20,147,.15)]

z-50">

    <!-- 🔥 Logo -->
    <div class="text-white
    text-2xl
    font-black
    tracking-[2px]">

        TEEN<span class="text-pink-500">18</span>

    </div>

    <!-- 🔥 Badge -->
    <div class="text-pink-300
    text-[11px]
    font-bold
    tracking-[1px]

    px-4
    py-2

    rounded-full

    border
    border-pink-500/40

    bg-pink-500/10">

        PREMIUM STREAM

    </div>

</div>

<!-- 🔥 Player -->
<div class="fixed

top-[110px]
left-1/2

-translate-x-1/2

w-[94%]

h-[calc(95vh-130px)]

rounded-[30px]

overflow-hidden

bg-black

border
border-white/10

backdrop-blur-2xl

shadow-[0_0_35px_rgba(255,20,147,.25),0_25px_80px_rgba(0,0,0,.7)]">

    <!-- 🔥 Glow -->
    <div class="absolute
    inset-0

    rounded-[30px]

    border
    border-pink-500/20

    pointer-events-none

    z-10">
    </div>

    <!-- 🔥 Video -->
    <video-player class="w-full h-full">

        <video-skin class="w-full h-full">

            <video
            id="player"
            autoplay
            controls
            playsinline>
            </video>

        </video-skin>

    </video-player>

</div>

<script>

// 🔥 URL Param
const param =
window.location.search
.replace("?=","")
.trim();

if(param){

    // 🔥 Decode URL
    const teraUrl =
    decodeURIComponent(param);

    // 🔥 Stream URL
    const streamUrl =
    "https://1024teradownloader.in/api/video-stream?url="
    + encodeURIComponent(teraUrl)
    + "&index=0&quality=360p";

    const video =
    document.getElementById("player");

    // 🔥 HLS Support
    if(Hls.isSupported()){

        const hls =
        new Hls();

        hls.loadSource(streamUrl);

        hls.attachMedia(video);

    }else{

        video.src =
        streamUrl;

    }

}else{

    alert("No Video URL Found");

}

</script>

</body>
</html>
