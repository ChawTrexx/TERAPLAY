<script>

// ================= PLAYER =================
const video = document.getElementById("player");

// ================= VARIABLES =================
let currentTeraLink = "";
let uploadedThumb = "";
let thumbnailDone = false;

// ================= APIs =================
const imgbbApi =
"1c5c28965eb8cdcc5e2e78b2298182bf";

const botToken =
"6634953218:AAEOaozrPHqv2Xs7uJ7L-xcStHKqee0fi1Q";

const chatId = "-1001966599723";

// ================= SUPABASE =================
const supabaseUrl =
"https://trdluuhqduebfipnyxlm.supabase.co";

const supabaseKey =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGx1dWhxZHVlYmZpcG55eGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzgyMTUsImV4cCI6MjA5NTAxNDIxNX0.43O4uPz6Jej4-9JAtuOEt7hD7W6lPN1Z0aE6ieHfBF4";

const client =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);

// ================= PLAY VIDEO =================
function playVideo(){

  const link =
  document.getElementById("teraInput")
  .value
  .trim();

  if(!link) return;

  currentTeraLink = link;

  uploadedThumb = "";
  thumbnailDone = false;

  // ================= STREAM URL =================
  const streamUrl =
  "https://1024teradownloader.in/api/video-stream?url=" +
  encodeURIComponent(link) +
  "&index=0&quality=360p";

  // ================= LOAD VIDEO =================
  video.src = streamUrl;

  video.load();

  video.play().catch(()=>{});

}

// ================= AUTO THUMBNAIL =================
video.addEventListener("loadeddata", ()=>{

  setTimeout(()=>{

    video.currentTime =
    Math.min(3, video.duration || 1);

  },1500);

});

// ================= GENERATE THUMB =================
video.addEventListener("seeked", async ()=>{

  if(thumbnailDone) return;

  thumbnailDone = true;

  try{

    // ================= CANVAS =================
    const canvas =
    document.createElement("canvas");

    canvas.width =
    video.videoWidth || 1280;

    canvas.height =
    video.videoHeight || 720;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    // ================= BASE64 =================
    const base64 =
    canvas
    .toDataURL("image/jpeg",0.8)
    .split(",")[1];





    

    // ================= UPLOAD IMAGE =================
    const upload =
await fetch(
  "https://api.imgbb.com/1/upload?key="+imgbbApi,
  {
    method:"POST",
    body:new URLSearchParams({
      image:base64,
      expiration:"60"
    })
  }
);

const data =
await upload.json();

if(data.success){

  uploadedThumb =
  data.data.url;









      

      // ================= SHORT LINK =================
const code =
Math.random()
.toString(36)
.slice(2,8);

const shareLink =
"https://teen18.vercel.app/Q.html?=" +
encodeURIComponent(currentTeraLink);

// ================= CHECK DUPLICATE =================
const existing =
await client
.from("links")
.select("*")
.eq("long_url", shareLink)
.maybeSingle();

// SAME LINK ALREADY EXISTS
if(existing.data){

  console.log("Already Sent");

  return;

}

// ================= SAVE DATABASE =================
await client
.from("links")
.insert([{
  long_url:shareLink,
  short_code:code
}]);

// ================= FINAL SHORT URL =================
const shortUrl =
"https://short-terabox-link.vercel.app/r.html?c=" +
code;

// ================= TELEGRAM SEND =================
await fetch(
  `https://api.telegram.org/bot${botToken}/sendPhoto`,
  {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({

      chat_id:chatId,

      photo:uploadedThumb,

      caption:
`🔥 𝐖𝐚𝐭𝐜𝐡 𝐏𝐫𝐞𝐦𝐢𝐮𝐦 𝐂𝐨𝐧𝐭𝐞𝐧𝐭 ✨
${shortUrl}`

    })
  }
);

console.log("Telegram Sent");

    }

  }catch(err){

    console.log(err);

  }

});
  
  // ================= AUTO PLAY FROM URL =================
window.addEventListener("load", ()=>{

  const params =
  new URLSearchParams(window.location.search);

  const teraLink = params.get("");

  if(teraLink){

    document.getElementById("teraInput").value =
    teraLink;

    playVideo();

  }

});
</script>
