<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
</head>

<body style="margin:0">

<iframe id="player" 
        style="width:100%;height:100vh;border:none;" 
        allowfullscreen>
</iframe>

<script>
// URL se ID nikaalo
const params = window.location.search;

// remove ?=
const id = params.replace("?=", "");

// final link banao
const iframeUrl = "https://terabox.beer/watch/" + id;

// iframe me set karo
document.getElementById("player").src = iframeUrl;
</script>

</body>
</html>
