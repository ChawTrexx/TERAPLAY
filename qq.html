<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teen18 Player</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#000;
}

/* 🔥 IFRAME FULL SCREEN */
#player{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100vh;
  border:none;
  z-index:1;
}

/* 🔥 HEADER OVERLAY */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:70px; /* change kar sakte ho */
  z-index:999999; /* 🔥 iframe se upar */
  
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:24px;
  font-weight:bold;
  color:#ff1493;

  /* transparent overlay style */
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(5px);
}
</style>

</head>

<body>

<iframe id="player" allowfullscreen></iframe>

<div class="header">
  Teen18 TeraBox
</div>

<script>
const id = window.location.search.replace("?=", "");
document.getElementById("player").src =
  "https://terabox.beer/watch/" + id;
</script>

</body>
</html>
