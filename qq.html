<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teen18 Player | Premium Experience</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
body{overflow:hidden;background:#050505;}

#player-container{
    position:fixed;
    top:0;left:0;
    width:100%;height:100vh;
    background:#000;
}

#player{
    width:100%;
    height:100%;
    border:none;
}

.header{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:95px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;

    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(255,20,147,0.3);

    animation:slideDown 0.5s ease-out;
}

@keyframes slideDown{
    from{transform:translateY(-100%);}
    to{transform:translateY(0);}
}

.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:1px;
    color:#fff;
    text-transform:uppercase;
}

.logo span{
    color:#ff1493;
    text-shadow:0 0 10px rgba(255,20,147,0.8);
}

.status-pill{
    background:rgba(255,20,147,0.2);
    border:1px solid #ff1493;
    color:#ff1493;
    padding:6px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
    cursor:pointer;
    transition:0.3s;
}

.status-pill:hover{
    background:#ff1493;
    color:#fff;
}

.no-select{
  -webkit-user-select:none;
  user-select:none;
}
</style>
</head>

<body class="no-select">

<header class="header">
    <div class="logo">TEEN<span>18</span> PLAYER</div>

    <!-- 🔥 Direct TeraBox Button -->
    <a id="teraLink" href="#" target="_blank">
        <div class="status-pill">TeraBox Link 🔗</div>
    </a>
</header>

<div id="player-container">
    <iframe id="player" allowfullscreen scrolling="no"></iframe>
</div>

<script>
const id = window.location.search.replace("?=", "");

if (id) {

    // 🎥 iframe player (optional)
    document.getElementById("player").src = "https://terabox.beer/watch/" + id;

    // 🔥 direct TeraBox open
    document.getElementById("teraLink").href = "https://1024terabox.com/s/" + id;

} else {
    console.error("No Video ID found");
}
</script>

</body>
</html>
