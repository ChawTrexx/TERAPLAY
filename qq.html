<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen18 Player | Premium Experience</title>

    <style>
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            overflow: hidden;
            background: #050505;
        }

        /* 🔥 Full Screen Player Section */
        #player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #000;
            z-index: 1;
        }

        #player {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 🔥 Modern Header Overlay */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 95px;
            z-index: 1000;
            
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;

            /* Glassmorphism Effect */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 20, 147, 0.3);
            
            /* Animation for entry */
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        .logo span {
            color: #ff1493; /* Neon Pink */
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
        }

        /* Status Indicator */
        .status-pill {
            background: rgba(255, 20, 147, 0.2);
            border: 1px solid #ff1493;
            color: #ff1493;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

    </style>
</head>

<body>

    <header class="header">
        <div class="logo">TEEN<span>18</span> PLAYER</div>
        <div class="status-pill">Streaming HD</div>
    </header>

    <div id="player-container">
        <iframe 
            id="player" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            scrolling="no"
            src="">
        </iframe>
    </div>

    <script>
        // Smooth Script to fetch ID
        const urlParams = new URLSearchParams(window.location.search);
        // Supports both ?id=123 or ?=123 format
        const id = urlParams.get('id') || window.location.search.replace("?=", "");
        
        if (id) {
            document.getElementById("player").src = "https://terabox.beer/watch/" + id;
        } else {
            console.error("No Video ID found in URL");
            // Optional: Redirect or show error message
        }
    </script>

</body>
</html>
