<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teen18 Player | Premium Experience</title>

<script src="https://quge5.com/88/tag.min.js"
data-zone="241403"
async
data-cfasync="false"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#000;
    height:100vh;
}

/* 🔥 Background */
.bg-image{
    position:fixed;
    inset:0;

    background:url('https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?q=80&w=1920&auto=format&fit=crop')
    center center/cover no-repeat;

    filter:blur(2px) brightness(0.35);

    transform:scale(1.05);

    z-index:-2;
}

/* 🔥 Overlay */
.bg-overlay{
    position:fixed;
    inset:0;

    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.82),
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.92)
    );

    z-index:-1;
}

/* 🔥 PREMIUM HEADER */
.header{
    position:fixed;
    top:15px;
    left:50%;

    transform:translateX(-50%);

    width:94%;
    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    z-index:1000;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.02)
        );

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 8px 32px rgba(0,0,0,0.45),
        0 0 25px rgba(255,20,147,0.12),
        inset 0 0 12px rgba(255,255,255,0.04);

    overflow:hidden;

    z-index:9999;
}

/* 🔥 Glow Line */
.header::before{
    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        #ff1493,
        transparent
    );

    animation:glowMove 4s linear infinite;
}

@keyframes glowMove{
    0%{
        transform:translateX(-100%);
    }
    100%{
        transform:translateX(100%);
    }
}

/* 🔥 Logo */
.logo{
    font-size:24px;
    font-weight:900;

    letter-spacing:2px;

    color:#fff;

    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(255,255,255,0.25),
        0 0 25px rgba(255,20,147,0.35);
}

.logo span{
    color:#ff1493;

    text-shadow:
        0 0 10px #ff1493,
        0 0 30px #ff1493,
        0 0 60px rgba(255,20,147,0.6);
}

/* 🔥 Premium Badge */
.header-badge{
    padding:10px 18px;

    border-radius:50px;

    background:rgba(255,20,147,0.12);

    border:1px solid rgba(255,20,147,0.35);

    color:#ff4db8;

    font-size:11px;
    font-weight:700;

    letter-spacing:1px;

    text-transform:uppercase;
}

/* 🔥 Video Frame */
.video-frame{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    width:95%;
    max-width:1000px;

    height:320px;

    overflow:hidden;

    border-radius:22px;

    background:#000;

    box-shadow:
        0 0 30px rgba(255,20,147,0.3);

    z-index:5;
}

/* 🔥 Crop iframe */
.video-frame iframe{

    position:absolute;

    top:-170px;
    left:0;

    width:100%;
    height:760px;

    border:none;
}

/* 🔥 Footer */
.footer{
    position:fixed;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    z-index:9999;
}

/* 🔥 Neo Button */
.neo-btn{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:15px 34px;

    border-radius:60px;

    background:rgba(15,15,15,0.55);

    border:1px solid rgba(255,20,147,0.7);

    color:#fff;

    text-decoration:none;

    font-size:14px;
    font-weight:700;

    letter-spacing:1px;

    text-transform:uppercase;

    overflow:hidden;

    backdrop-filter:blur(14px);

    box-shadow:
        0 0 12px rgba(255,20,147,0.5),
        0 0 35px rgba(255,20,147,0.25),
        inset 0 0 12px rgba(255,20,147,0.18);

    transition:0.35s ease;
}

.neo-btn:hover{
    transform:scale(1.06);

    box-shadow:
        0 0 15px #ff1493,
        0 0 40px #ff1493;
}

/* 📱 Mobile */
@media(max-width:768px){

    .header{
        width:92%;
        height:70px;
        padding:0 16px;
    }

    .logo{
        font-size:18px;
    }

    .header-badge{
        font-size:9px;
        padding:8px 12px;
    }

    .video-frame{
        height:240px;
    }

    .video-frame iframe{
        top:-140px;
        height:650px;
    }

    .neo-btn{
        padding:13px 24px;
        font-size:12px;
    }
}

</style>
</head>

<body>

<!-- 🔥 Background -->
<div class="bg-image"></div>
<div class="bg-overlay"></div>

<!-- 🔥 Header -->
<header class="header">

    <div class="logo">
        TEEN<span>18</span> PLAYER
    </div>

    <div class="header-badge">
        Ultra HD Streaming
    </div>

</header>

<!-- 🔥 Video Frame -->
<div class="video-frame">

    <iframe
        id="videoFrame"
        allowfullscreen>
    </iframe>

</div>

<!-- 🔥 Footer -->
<div class="footer">

    <a
        id="teraLink"
        class="neo-btn"
        href="#"
        target="_blank">

        🚀 TERABOX LINK 🚀

    </a>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const videoUrl = params.get("url");

if(videoUrl){

    // 🔥 Support ALL TeraBox Domains
    const supportedDomains = [
        "1024terabox.com",
        "terabox.com",
        "teraboxapp.com",
        "teraboxlink.com",
        "terasharelink.com",
        "teraboxshare.com",
        "terasharefile.com",
        "nephobox.com",
        "freeterabox.com",
        "momerybox.com",
        "1024tera.com"
    ];

    // ✅ Check valid domain
    const isValid = supportedDomains.some(domain =>
        videoUrl.includes(domain)
    );

    if(isValid){

        // 🎥 iframe player
        document.getElementById("videoFrame").src =
            "https://1024teradownloader.in/watch?url=" +
            encodeURIComponent(videoUrl);

        // 🔗 Footer button
        document.getElementById("teraLink").href =
            videoUrl;

    }else{

        alert("Invalid TeraBox URL");

    }

}else{

    console.error("No URL Found");

}

</script>

</body>
</html>
