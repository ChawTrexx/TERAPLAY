    <script type="module">

const SUPABASE_URL = "https://emhnjxzenbxsaxdpzltf.supabase.co";
const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtaG5qeHplbmJ4c2F4ZHB6bHRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0Nzk2MzcsImV4cCI6MjA5MTA1NTYzN30.7f0MSHe_UABXWnLhZh0oPYrGzMiiggiBpALuhLnDL1U";

// URL se ID lena (parseInt use kiya taaki database number se match ho)
const rawId = new URLSearchParams(location.search).get("id");
const videoId = rawId ? parseInt(rawId) : null;



      // ===== VIDEO RENDER =====
function renderVideo(v){

    const link = (v.video_link || "").trim();

    // 🔥 Check: SAFE iframe hai ya nahi
    if(link.startsWith("<iframe") && link.includes("sandbox")){
        return link; // direct render iframe
    }


  
if(link.startsWith("http")){
        return ` 

        <video-player>
  <video-skin>
    <video src="${link}" playsinline></video>
  </video-skin>
</video-player>

        `;
    }

    // ❌ Fallback (invalid case)
    return `<p style="color:red;">Invalid Video</p>`;
}





  
// ===== LOAD VIDEO =====
async function loadVideo(){
  if(!videoId) {
      document.getElementById("vtitle").innerText = "No Video ID provided!";
      return;
  }

  const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}&select=*`, {
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY
    }
  });

  const data = await res.json();
  if(!data.length) {
      document.getElementById("vtitle").innerText = "Video Not Found!";
      return;
  }

  const v = data[0];

  document.getElementById("player").innerHTML = renderVideo(v);
  document.getElementById("vtitle").innerText = v.title;
  document.getElementById("vmeta").innerHTML = `${v.views || 0} views`;

  // UPDATE VIEWS
  await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}`, {
    method:"PATCH",
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      views: (v.views || 0) + 1
    })
  });
}

// ===== LOAD RECOMMENDED =====




async function loadRecommended(){

  // 🔥 helper function
  function extractVideoInfo(title){
  let lower = title.toLowerCase();

  let match = lower.match(/(part|video)[\s-]*(\d+)/i);
  let number = match ? parseInt(match[2]) : 0;

  let base = lower
    .replace(/(part|video)[\s-]*\d+/ig, '')
    .replace(/[^\w\s]/g, '')   // 🔥 emoji + symbols remove
    .replace(/\s+/g, ' ')      // extra spaces fix
    .trim();

  return { baseTitle: base, partNumber: number };
  }

  // Current video title
  const currentRes = await fetch(`${SUPABASE_URL}/rest/v1/videos?id=eq.${videoId}&select=title`, {
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY
    }
  });

  const currentData = await currentRes.json();
  if(!currentData.length) return;

  let fullTitle = currentData[0].title;

  // 🔥 NEW LOGIC
  let { baseTitle, partNumber } = extractVideoInfo(fullTitle);

  // Fetch similar videos
  const res = await fetch(`${SUPABASE_URL}/rest/v1/videos?title=ilike.*${baseTitle}*&select=id,title,thumbnail,video_link,views`, {
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY
    }
  });

  const data = await res.json();

  // 🔥 FILTER + SORT
  let filtered = data
    .map(v => {
      let info = extractVideoInfo(v.title);
      return { ...v, part: info.partNumber, base: info.baseTitle };
    })
    .filter(v => v.base === baseTitle && v.id != videoId)
    .sort((a,b) => a.part - b.part);

  // 👉 only next parts (optional but best UX)
  filtered = filtered.filter(v => v.part > partNumber);

  const box = document.getElementById("recommended");
  box.innerHTML = "";

  filtered.forEach(v => {

    let thumbHTML = "";

    // 🎥 VIDEO PREVIEW (same as your code)
    if(v.thumbnail && v.thumbnail.endsWith(".mp4")){
        thumbHTML = `
        <video 
          src="${v.thumbnail}"
          muted autoplay playsinline preload="metadata"
          onloadedmetadata="this.playbackRate=0.5"
          ontimeupdate="if(this.currentTime>=3){this.currentTime=0}"
          style="width:140px;height:80px;object-fit:cover;border-radius:8px;">
        </video>`;

    } else if(v.video_link && v.video_link.endsWith(".mp4")){
        thumbHTML = `
        <video 
          src="${v.video_link}"
          muted autoplay playsinline preload="metadata"
          onloadedmetadata="this.playbackRate=0.5"
          ontimeupdate="if(this.currentTime>=3){this.currentTime=0}"
          style="width:140px;height:80px;object-fit:cover;border-radius:8px;">
        </video>`;

    } else {
        // 🖼 IMAGE fallback
        thumbHTML = `<img src="${v.thumbnail || 'default.jpg'}" style="width:140px;height:80px;object-fit:cover;border-radius:8px;">`;
    }

    box.innerHTML += `
      <div class="recommend-item" onclick="location='Watch.html?id=${v.id}'">
        ${thumbHTML}
        <div>
          <b>${v.title}</b><br>
          <small>${v.views || 0} views</small>
        </div>
      </div>`;
  });

}





      

// ================= COMMENT SYSTEM =================

// Random Username generate karna agar nahi hai
if (!localStorage.getItem("userName")) {
  localStorage.setItem("userName", "User" + Math.floor(Math.random()*9999));
}
const username = localStorage.getItem("userName");

// Open/Close functions ko window object mein dalna taaki onclick kaam kare
window.openComments = () => document.getElementById("commentPanel").style.bottom = "0";
window.closeComments = () => document.getElementById("commentPanel").style.bottom = "-100%";

// SEND COMMENT
window.sendComment = async () => {
  const textInput = document.getElementById("commentText");
  const text = textInput.value.trim();
  
  if(!text || !videoId) return;

  const response = await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
    method:"POST",
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY,
      "Content-Type":"application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify({
      video_id: videoId,
      user_name: username,
      content: text // SQL mein 'content' column hai isliye 'content' rakha
    })
  });

  if(response.ok) {
      textInput.value = "";
      loadComments();
  } else {
      alert("Error posting comment!");
  }
};

// LOAD COMMENTS
async function loadComments(){
  if(!videoId) return;

  const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?video_id=eq.${videoId}&select=*&order=created_at.desc`, {
    headers:{
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY
    }
  });

  const data = await res.json();
  const list = document.getElementById("commentsList");
  list.innerHTML = "";

  document.getElementById("commentCount").innerText = data.length;
  document.getElementById("latestComment").innerText = data[0] ? data[0].content : "No comments yet...";

  data.forEach(c => {
    list.innerHTML += `
      <div class="comment-item">
         <div class="user">⭐ ${c.user_name}</div>
         <div style="word-wrap: break-word;">${c.content}</div>
      </div>`;
  });
}

// Initialization

loadComments();
